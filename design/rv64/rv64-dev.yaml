apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rv64-dev-work
  namespace: tenant-kuberoot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replicated
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rv64-dev
  namespace: tenant-kuberoot
  labels:
    app: rv64-dev
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: rust
      image: rust:1.85.1-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4
      command: [bash, -ceu]
      args:
        - |
          mkdir -p /work/cargo /work/rustup /work/target /work/tmp /work/src
          if [ ! -f /work/rustup/.seeded ]; then
            cp -a /usr/local/rustup/. /work/rustup/
            touch /work/rustup/.seeded
          fi
          exec sleep infinity
      env:
        - {name: CARGO_HOME, value: /work/cargo}
        - {name: RUSTUP_HOME, value: /work/rustup}
        - {name: CARGO_TARGET_DIR, value: /work/target}
        - {name: TMPDIR, value: /work/tmp}
        - {name: CARGO_BUILD_JOBS, value: '4'}
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
          ephemeral-storage: 100Mi
        limits:
          cpu: '4'
          memory: 8Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        - {name: work, mountPath: /work}
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: rv64-dev-work
