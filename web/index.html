<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="DevOps Trainer — интерактивный учебник и тренажёр для входа в DevOps: настоящий Linux в браузере, облако во вкладке, квизы и экзамены. Бесплатно, на русском и английском." />
    <meta name="theme-color" content="#353a6e" />
    <title>DevOps Trainer — интерактивный учебник и тренажёр входа в DevOps</title>
    <link rel="canonical" href="https://damn.academy/" />
    <!-- The course switches language in the browser without separate URLs, so
         there are no hreflang pairs to declare; document language is set on
         <html> dynamically. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevOps Trainer" />
    <meta property="og:url" content="https://damn.academy/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="DevOps Trainer — интерактивный учебник и тренажёр входа в DevOps" />
    <meta property="og:description" content="Настоящий Linux в браузере, облако во вкладке, симуляторы, квизы и экзамены. Бесплатный курс на русском и английском." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DevOps Trainer — интерактивный учебник входа в DevOps" />
    <meta name="twitter:description" content="Настоящий Linux в браузере, облако во вкладке, симуляторы и экзамены. Бесплатно, на русском и английском." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "DevOps Trainer",
      "alternateName": "damn.academy",
      "description": "Интерактивный учебник и тренажёр входа в DevOps для взрослых, меняющих профессию: настоящий Linux в браузере, облако во вкладке, симуляторы сетей и Kubernetes, квизы и экзамены.",
      "inLanguage": ["ru", "en"],
      "isAccessibleForFree": true,
      "url": "https://damn.academy/",
      "provider": { "@type": "Organization", "name": "damn.academy", "url": "https://damn.academy/" },
      "teaches": ["Linux", "Компьютерные сети", "Containers", "Kubernetes", "CI/CD", "Infrastructure as Code", "Мониторинг", "Git"],
      "hasCourseInstance": {
        "@type": "CourseInstance",
        "courseMode": "online",
        "courseWorkload": "P2M"
      }
    }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3' width='20' height='18' rx='4' fill='%23353a6e'/%3E%3Cpath d='m7 9 3 3-3 3m5 0h5' stroke='%23f4efe4' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint, so a dark-theme reader never sees a white flash.
      try {
        var t = localStorage.getItem('dt.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('dt.calm') === '1') document.documentElement.setAttribute('data-calm', '');
        var l = localStorage.getItem('dt.lang');
        if (l === 'en' || l === 'ru') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>DevOps Trainer needs JavaScript: the textbook, terminal and diagrams all run in the browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
