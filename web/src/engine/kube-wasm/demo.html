<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kube.wasm terminal (dev)</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --dim: #6e6e73; --err: #c0392b; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #e8e8ea; --dim: #8e8e93; --err: #ff6b5e; --line: #3a3a3c; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-monospace, "IBM Plex Mono", Menlo, monospace; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; gap: 8px; }
    header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; }
    #status { color: var(--dim); }
    #out { flex: 1; overflow: auto; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    .cmd { font-weight: 600; } .err { color: var(--err); } .log { color: var(--dim); }
    .row { display: flex; gap: 8px; align-items: center; }
    #cmd { flex: 1; font: inherit; padding: 6px 8px; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; }
    details textarea { width: 100%; box-sizing: border-box; height: 120px; font: inherit; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <header><h1>kube.wasm</h1><span id="status">loading...</span></header>
    <pre id="out"></pre>
    <details><summary>stdin for the next command (for <code>apply -f -</code>)</summary><textarea id="stdin" spellcheck="false"></textarea></details>
    <div class="row"><span>$ kubectl</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="get ns" disabled></div>
  </main>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
