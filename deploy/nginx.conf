server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json;

    # Precompressed .gz files sit next to text assets; others are compressed on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/manifest+json application/wasm;

    # deploy.sh derives every file's mtime from its content, so ETags change
    # exactly when content does while the image layers stay reproducible.
    etag on;
    max_ranges 16;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /index.html {
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # Vite output: names carry a content hash.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # v86 images. Content-addressed files and boot snapshots never change;
    # the rest (manifests, fs.json, kernel, BIOS) is revalidated by ETag.
    # .bin.zst and boot .bin are decoded by the page, so they are sent as is.
    location /v86/ {
        types {
            application/json json;
            application/javascript js mjs;
            application/wasm wasm;
            application/zstd zst;
        }
        default_type application/octet-stream;
        try_files $uri =404;
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "no-cache" always;
        location /v86/lab/files/ {
            try_files $uri =404;
            include /etc/nginx/dt-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ~ ^/v86/lab/boot-.+-[0-9a-f]{16}\.bin$ {
            try_files $uri =404;
            include /etc/nginx/dt-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/dt-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
