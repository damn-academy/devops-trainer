# Rendered by smoke.sh: JOB_NAME, GIT_URL, GIT_SHA and DT_HOST are replaced.
# Headless Chromium against the public URL, from inside the cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: JOB_NAME
  namespace: devops-trainer
  labels: {app.kubernetes.io/name: smoke, app.kubernetes.io/part-of: devops-trainer}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: smoke, app.kubernetes.io/part-of: devops-trainer}
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: mcr.microsoft.com/playwright:v1.65.1-noble
          command:
            - bash
            - -euc
            - |
              # The image has node but not necessarily git: fetch the source archive.
              node -e 'fetch(process.argv[1]).then(async (r) => { if (!r.ok) throw new Error(r.status); require("fs").writeFileSync("/work/src.tgz", Buffer.from(await r.arrayBuffer())); })' "$GIT_URL/archive/$GIT_SHA.tar.gz"
              mkdir /work/src && tar -xzf /work/src.tgz -C /work/src --strip-components=1
              cd /work/src/web
              npm ci --no-audit --no-fund --ignore-scripts >/dev/null
              node scripts/smoke-public.mjs
          env:
            - {name: GIT_URL, value: 'GIT_URL'}
            - {name: GIT_SHA, value: 'GIT_SHA'}
            - {name: DT_URL, value: 'https://DT_HOST'}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: feedback-secrets, key: ADMIN_TOKEN}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: work
          emptyDir: {sizeLimit: 4Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
